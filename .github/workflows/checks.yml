name: Check Circuit Studio
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke-test AI training and checkpoint recovery
        run: |
          npm run train:ai -- --phase bc --tracks 6 --seconds 5 --updates 1 --dagger-updates 1 --iterations 3 --batch 1 --out training/runs/ci-smoke
          npm run train:ai -- --phase bc --resume training/runs/ci-smoke/checkpoint.json --out training/runs/ci-smoke
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run test:ai:browser -- training/runs/ci-smoke/policy.json
      - name: Smoke-test a full grid in wet Las Vegas at night
        run: npm run bench:wet-race -- ci
        env:
          WET_RACE_SECONDS: 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots
          path: test-results/
